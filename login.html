<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-main-custom">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-4">
                
                <header class="text-center mb-4">
                    <h1 class="display-5 text-white fw-bold">
                        <span class="text-orange">Login</span>
                    </h1>
                    <button id="theme-toggle" class="btn btn-outline-light btn-sm mt-2 border-0">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </header>

                <section class="login-container p-4 p-md-5 rounded-4 shadow-lg bg-secondary-custom">
                    <h2 class="h3 text-white text-center mb-4">Iniciar Sesión</h2>
                    
                    <form class="form-login" onsubmit="iniciarSesion(event)">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label text-white-50">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Ingresa tu usuario" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-white-50">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Tu contraseña" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold py-2">Ingresar</button>
                        </div>

                        <p class="text-center text-white-50 mb-0">
                            ¿No tienes cuenta? 
                            <a href="registro.html" class="text-orange text-decoration-none fw-bold">Regístrate aquí</a>
                        </p>
                    </form>
                </section>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
</body>

</html>
