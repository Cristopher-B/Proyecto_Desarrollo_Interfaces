<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="layout">

        <div class="main">
            <header>
                <h1><span>Login</span></h1>
                                <div class="icons">
                  <button id="theme-toggle" class="header-theme-toggle"><i class="fa-solid fa-moon"></i></button> 
                </div>
            </header>

            <div class="main">
                <section class="login-section">
                    <div class="login-container">

                        <h2>Iniciar Sesión</h2>

                        <form class="form-login" onsubmit="iniciarSesion(event)">


                            <div class="input-container">
                                <label for="username">Usuario</label>
                                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario"
                                    required>
                            </div>

                            <div class="input-container">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" name="password" placeholder="Tu contraseña"
                                    required>
                            </div>

                            <div class="btn-container">
                                <button type="submit" class="btn-login">Ingresar</button>
                            </div>

                            <p class="login-link">
                                ¿No tienes cuenta?
                                <a href="registro.html">Regístrate aquí</a>
                            </p>

                        </form>

                    </div>
                </section>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>

</html>
