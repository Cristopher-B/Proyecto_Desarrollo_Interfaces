<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-main-custom">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <header class="text-center mb-4">
                    <h1 class="display-5 text-white fw-bold">
                        <span class="text-orange">Registro</span>
                    </h1>
                    <button id="theme-toggle" class="btn btn-outline-light btn-sm mt-2">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </header>

                <section class="registro-container p-4 p-md-5 rounded-4 shadow bg-secondary-custom">
                    <h2 class="h3 text-white text-center mb-4">Crear Cuenta</h2>
                    
                    <form class="form-registro" onsubmit="registrarUsuario(event)">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label text-white-50">Nombre de Usuario</label>
                            <input type="text" id="username" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Tu nombre de usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-white-50">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="Tu correo electrónico" required>
                        </div>

                        <div class="mb-3">
                            <label for="dob" class="form-label text-white-50">Fecha de Nacimiento</label>
                            <input type="date" id="dob" name="dob" class="form-control bg-dark text-white border-secondary" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label text-white-50">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Tu contraseña" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirm-password" class="form-label text-white-50">Confirmar Contraseña</label>
                            <input type="password" id="confirm-password" name="confirm-password" class="form-control bg-dark text-white border-secondary" placeholder="Confirmar contraseña" required>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold py-3">Registrar Cuenta</button>
                            <p class="text-center text-white-50 mb-0">
                                ¿Ya tienes una cuenta? 
                                <a href="login.html" class="text-orange text-decoration-none fw-bold">Inicia Sesión</a>
                            </p>
                        </div>

                    </form>
                </section>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
</body>

</html>
