<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="layout">

        <div class="main">
            <header>
                <h1><span>Registro</span></h1>
                                <div class="icons">
                  <button id="theme-toggle" class="header-theme-toggle"><i class="fa-solid fa-moon"></i></button> 
                </div>
            </header>
            <div class="main">
                <section class="registro">
                    <div class="registro-container">
                        <h2>Crear Cuenta</h2>
                        <form class="form-registro" onsubmit="registrarUsuario(event)">
                            <div class="input-container">
                                <label for="username">Nombre de Usuario</label>
                                <input type="text" id="username" name="username" placeholder="Tu nombre de usuario"
                                    required>
                            </div>
                            <div class="input-container">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" id="email" name="email" placeholder="Tu correo electrónico"
                                    required>
                            </div>
                            <div class="input-container">
                                <label for="dob">Fecha de Nacimiento</label>
                                <input type="date" id="dob" name="dob" required>
                            </div>
                            <div class="input-container">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" name="password" placeholder="Tu contraseña"
                                    required>
                            </div>
                            <div class="input-container">
                                <label for="confirm-password">Confirmar Contraseña</label>
                                <input type="password" id="confirm-password" name="confirm-password"
                                    placeholder="Confirmar contraseña" required>
                            </div>

                            <div class="btn-container" style="display: flex; flex-direction: column; gap: 15px;">
                                <button type="submit" class="btn-registro">Registrar Cuenta</button>
                                <p class="login-link">
                                ¿Ya tienes una tienes cuenta?
                                <a href="login.html">Inicia Sesión</a>
                            </p>
                            </div>

                        </form>
                    </div>


                </section>
            </div>
            <script src="auth.js"></script>
</body>

</html
